name: Lint Chart

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint . --strict
