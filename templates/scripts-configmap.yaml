apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis-cluster.fullname" . }}-scripts
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "redis-cluster.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  startup.sh: |-
    #!/bin/bash
    set -e

    echo "Starting Redis on ${HOSTNAME} with cluster-announce-ip: ${POD_IP}"

    ARGS=(
      /etc/redis/redis.conf
      --cluster-announce-ip "${POD_IP}"
    )

    {{- if .Values.auth.enabled }}
    if [ -n "${REDIS_PASSWORD}" ]; then
      ARGS+=(--requirepass "${REDIS_PASSWORD}" --masterauth "${REDIS_PASSWORD}")
    fi
    {{- end }}

    exec redis-server "${ARGS[@]}"

  ping_readiness_local.sh: |-
    #!/bin/bash
    set -e

    {{- if .Values.auth.enabled }}
    export REDISCLI_AUTH="${REDIS_PASSWORD}"
    {{- end }}

    response=$(
      timeout -s TERM "$1" \
      redis-cli \
        -h localhost \
        -p {{ .Values.redis.port }} \
        ping
    )

    if [ "$response" != "PONG" ]; then
      echo "Unexpected response: ${response:-empty}"
      exit 1
    fi

  ping_liveness_local.sh: |-
    #!/bin/bash

    {{- if .Values.auth.enabled }}
    export REDISCLI_AUTH="${REDIS_PASSWORD}"
    {{- end }}

    response=$(timeout -s TERM "$1" redis-cli -h localhost -p {{ .Values.redis.port }} ping 2>/dev/null)
    exit_code=$?

    if [ "${exit_code}" -eq "124" ]; then
      echo "Timed out"
      exit 1
    fi

    first_word=$(echo "$response" | awk '{print $1}')
    if [ "$response" != "PONG" ] && [ "$first_word" != "LOADING" ] && [ "$first_word" != "MASTERDOWN" ]; then
      echo "Unexpected response: ${response:-empty}"
      exit 1
    fi

  cluster-init.sh: |-
    #!/bin/bash
    set -e

    REDIS_PORT={{ .Values.redis.port }}
    CLUSTER_NODES={{ .Values.cluster.nodes }}
    CLUSTER_REPLICAS={{ .Values.cluster.replicas }}
    NAMESPACE="${POD_NAMESPACE}"
    HEADLESS_SVC="${REDIS_HEADLESS_SVC}"
    DOMAIN="${REDIS_CLUSTER_DOMAIN}"
    FULLNAME="${REDIS_FULLNAME}"

    {{- if .Values.auth.enabled }}
    export REDISCLI_AUTH="${REDIS_PASSWORD}"
    {{- end }}

    FQDNS=()
    for i in $(seq 0 $(( CLUSTER_NODES - 1 ))); do
      FQDNS+=("${FULLNAME}-${i}.${HEADLESS_SVC}.${NAMESPACE}.svc.${DOMAIN}")
    done

    echo "=== Step 1: Resolving pod IPs via DNS ==="
    NODE_IPS=()
    for fqdn in "${FQDNS[@]}"; do
      echo -n "  Resolving ${fqdn} ..."
      ip=""
      for attempt in $(seq 1 60); do
        ip=$(getent hosts "${fqdn}" 2>/dev/null | awk '{print $1}' | head -1)
        if [ -n "${ip}" ]; then
          echo " -> ${ip}"
          break
        fi
        echo -n "."
        sleep 2
      done
      if [ -z "${ip}" ]; then
        echo " ERROR: DNS resolution timed out after 120s"
        exit 1
      fi
      NODE_IPS+=("${ip}:${REDIS_PORT}")
    done

    echo ""
    echo "=== Step 2: Waiting for Redis nodes to accept connections ==="
    for entry in "${NODE_IPS[@]}"; do
      ip="${entry%%:*}"
      echo -n "  Pinging ${ip}:${REDIS_PORT} ..."
      for attempt in $(seq 1 60); do
        result=$(timeout 5 redis-cli -h "${ip}" -p "${REDIS_PORT}" ping 2>&1)
        if echo "${result}" | grep -q "PONG"; then
          echo " -> OK"
          break
        fi
        if [ "${attempt}" -eq 60 ]; then
          echo " ERROR: no PONG after 60 attempts"
          exit 1
        fi
        echo -n "."
        sleep 3
      done
    done

    echo "All ${CLUSTER_NODES} nodes are ready. IPs: ${NODE_IPS[*]}"

    echo ""
    echo "=== Step 3: Checking cluster state ==="
    FIRST_IP="${NODE_IPS[0]%%:*}"
    cluster_info=$(redis-cli -h "${FIRST_IP}" -p "${REDIS_PORT}" CLUSTER INFO 2>/dev/null) || true
    cluster_state=$(echo "${cluster_info}" | grep cluster_state | tr -d '[:space:]' | cut -d: -f2)
    cluster_size=$(echo "${cluster_info}"  | grep cluster_size  | tr -d '[:space:]' | cut -d: -f2)

    if [ "${cluster_state}" = "ok" ] && [ "${cluster_size:-0}" -gt "0" ]; then
      echo "Cluster already initialized (state=${cluster_state}, size=${cluster_size}). Skipping."
      exit 0
    fi

    echo ""
    echo "=== Step 4: Creating Redis cluster ==="
    redis-cli --cluster create \
      "${NODE_IPS[@]}" \
      --cluster-replicas "${CLUSTER_REPLICAS}" \
      --cluster-yes

    echo "Redis cluster initialized successfully."

    echo ""
    echo "=== Step 5: Verifying cluster ==="
    sleep 2
    redis-cli -h "${FIRST_IP}" -p "${REDIS_PORT}" CLUSTER INFO
    redis-cli -h "${FIRST_IP}" -p "${REDIS_PORT}" CLUSTER NODES
